[defaults]
roles_path = roles
host_key_checking = False
retry_files_enabled = False
# The prettier "yaml" callback lives in community.general; the playbook itself
# needs only ansible.builtin, so keep the stdout callback core-only and let a
# bare `pipx install ansible-core` work without installing any collections.
stdout_callback = default
gathering = smart

[ssh_connection]
pipelining = True
